[package]
name = "niox-config"
description = "Loading and validation of niox's TOML config (/etc/niox/niox.toml)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.3"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3.27.0"
