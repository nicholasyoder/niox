[package]
name = "niox-ipc"
description = "niox's local control channel: newline-delimited JSON over nioxd's Unix socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The same nix the other crates use: SO_PEERCRED and group lookup.
nix = { version = "0.29", features = ["poll", "socket", "user"] }
# Passing the audio channel's fd (SCM_RIGHTS) and its SOCK_SEQPACKET
# socketpair, with owned fds and no unsafe code.
rustix = { version = "1.1.6", features = ["net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
nix = { version = "0.29", features = ["user"] }
serde_json = "1.0.154"
