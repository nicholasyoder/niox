[package]
name = "nioxd"
description = "niox privileged system service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
niox-config.workspace = true
niox-ipc.workspace = true
niox-km.workspace = true
niox-transport.workspace = true
# The same nix niox-km uses, for poll(2).
nix = { version = "0.29", features = ["poll"] }
signal-hook = "0.4.6"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
